# ⚠️ 已停用：這是 2026-08-26 的 PoC 死數字版設定，僅供根目錄既有分析腳本參考。
# 正式設定以 config.yaml 為準（對齊 design.md §7 的動態判斷版本）。
# 兩者的差異：本檔用「可借車數 ≤ 3」這類固定門檻；正式版改為由預測到達存量比對安全緩衝動態觸發。

# YouBike 智慧調度系統 — 規則引擎設定檔
# D8: 所有閾值與權重外部化，不寫死在程式碼裡
# 修改此檔後系統自動套用新參數，不需改程式碼

# === 調度資源限制 ===
fleet:
  調度車數量: 20
  每車容量: 25        # 台/車
  每趟最大站數: 5
  響應時間_分鐘: 30    # 從派發到到達的平均時間

# === 觸發規則 ===
trigger:
  # 預測區間下界觸發（D3）
  # 當預測的 10% 下界 ≤ 此數量時，觸發補車考慮
  空站危險_可借車數: 3
  滿站危險_可還位數: 3

  # 借用率觸發
  低水位_借用率%: 10    # 低於此 → 觸發補車
  高水位_借用率%: 90   # 高於此 → 觸發取車

  # 連續惡化觸發
  連續惡化時段數: 2     # 連續 N 個時段借用率持續下降 → 提前觸發

# === 目標水位 ===
target:
  補車後目標_借用率%: 50
  取車後目標_借用率%: 50
  # 未來可以改為動態目標水位（從 dynamic_target_level.parquet 讀取）

# === 優先級計算 ===
priority:
  # 優先分數 = 緊急度 × 影響權重 × 到達可行性
  緊急度權重: 1.0       # 距離空/滿還有幾台
  站點流量權重: 0.5     # 高使用量站優先
  容量倒數權重: 0.3     # 小站容錯低，優先處理

# === 每時段容量約束 ===
capacity:
  每時段最大調度站數: 15   # 現實約束：每 30 分鐘最多能到幾站
  每站最大搬運量: 25       # 不超過車輛容量

# === 調度員疲勞管理 ===
fatigue:
  單次最大搬運量_台: 150   # 累積超過此數 → 排入休息
  法定休息間隔_小時: 4
  休息時間_分鐘: 30

# === 異常偵測（覆寫優先級）===
anomaly:
  覆寫觸發_偏差%: 50      # 實際 vs 預測偏差超過此值 → 覆寫為最高優先
  連續異常觸發次數: 3      # 連續 N 次異常 → 觸發自適應修正
