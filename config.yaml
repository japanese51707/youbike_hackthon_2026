# YouBike 智慧調度系統 — 系統設定檔（單一真實來源）
# 來源：.kiro/specs/youbike-dispatch-system/design.md §7　最後對齊：2026-08-31
#
# 核心決策（已與團隊確認）：觸發門檻採「動態判斷」，不用固定死數字。
#   predictor 依各站「歷史同星期同時段」的淨流出/流入等特徵，產出預測「區間」；
#   rule_engine 一律吃區間下界 lower_bound 當「預測到達存量」，比對 trigger.安全緩衝_台數，
#   不吃點估計（steering §5：規則引擎吃區間下界；NFR-1 可解釋性）。
#   trigger 底下的低/高水位百分比只是保底的輔助門檻，不是主要判斷依據。
#   根目錄 rule_engine.py 已於 2026-08-31 遷移為此動態版本。
#
# 這是系統的控制面板：所有數字集中在這裡，改這裡就能調整系統行為，不用改程式碼（D8）。
# 舊的 PoC 死數字版本已移到 config.poc_v1.yaml，根目錄既有分析腳本尚未遷移（見 README/交接說明）。

# ── 資料源（NFR-7 可抽換）──
data_source:
  mode: "youbike_official"  # mock / historical / tdx / youbike_official（現場改這裡切換）
  # ADR-305：開發模式資料源降級。正式模式(youbike_official)永遠維持 ADR-303（失敗→同源 stale→503，不碰 mock）。
  # 只有把 mode 設成非正式源做本機開發、且此開關為 true 時，真實源完全取不到快照才降級到 mock；
  # 降級 mock 一律標 data_freshness=mock、dispatch_eligible=false，不進調度決策。預設 false。
  dev_fallback_to_mock: false
  tdx_api_key: ""           # 若用 TDX，正式環境填（勿寫進版控，用環境變數）
  youbike_official_url: ""  # 留空使用新北官方 HTTPS；其他來源需新增 adapter
  historical_local_dir: output/youbike_parquet  # 相對 repo；空字串才使用 S3，可用 YOUBIKE_HISTORY_DIR 覆寫
  refresh_interval_sec: 300  # 多久抓一次即時資料
  stale_after_sec: 600      # 即時資料超過幾秒視為過期（觸發降級標記）
  future_tolerance_sec: 60
  timeout_sec: 10
  max_response_bytes: 5000000
  min_refresh_sec: 60
  retry_backoff_sec: 30
  observation_max_stations: 3000
  observation_max_points: 2100  # 約一週五分鐘觀測；有界記憶體，重啟需重新累積
  # 歷史資料源（S3 Parquet）。ADR-307：競賽現場遷至 us-east-1 帳號的 bucket
  # （原 youbike-hackathon-2026 在原帳號東京區；現場為全新帳號 us-east-1）。
  s3_bucket: "youbike-hackathon-2026-use1"
  s3_prefix: "youbike_data"           # 分區：youbike_data/year_month=YYYY-MM/data.parquet
  historical_default_month: "2026-06" # 未指定月份時的預設分區

# ── 自動偵測調度完成（ADR-310）──
# 調度員執行任務不必人工回報搬運量：背景輪詢官方即時站況，偵測進行中任務的待處理站
# 是否已達派工目標（補車→可借數上升逼近 target；取車→下降逼近 target），達標即自動
# 標記該站完成並推進任務。不論車是誰移動的，只要達目標水位，該站調度需求即消化。
# 僅在真實資料源（非 mock）且 enabled=true 時運作。
auto_detect:
  enabled: true             # 是否啟用自動偵測（mock 模式一律不啟）
  輪詢間隔_秒: 60            # 多久掃一次進行中任務（官方源約 5 分更新，60~300 合理）
  逼近容差_台數: 2          # 現值落在目標 ± 此容差內視為「已達標」
  最小變化比例: 0.5         # 車數變化需至少達派工量的此比例，才算是真的被調度（濾自然波動）

# ── 資料保留（FR-12 熱溫冷）──
retention:
  hot_days: 14              # 熱資料（即時推論）
  warm_days: 90             # 溫資料（重訓練/趨勢）
  # 超過 warm_days 歸檔或刪除

# ── 觸發規則（rule_engine 用）──
# 注意：空/滿危險「不是死數字」，而是動態的。
# 依各站「歷史同星期同時段」接下來 30 分鐘的淨流出/流入來判斷：
#   預測到達時存量 = 當前存量 - 該站該時段的歷史淨流出
#   若預測到達時存量會觸底（≤ 安全緩衝）→ 觸發
# 下面只設「安全緩衝」與「觸發靈敏度」這種通用參數，實際門檻由模型動態算。
trigger:
  安全緩衝_台數: 2           # 預測到達存量低於此視為危險（各站共用的最低緩衝）
  觸發靈敏度: 1.0           # 對淨流出速率的放大係數（越大越早觸發）
  低水位_借用率百分比: 10    # 輔助門檻（動態判斷之外的保底）
  高水位_借用率百分比: 90
  連續惡化時段數: 2
  # 動態核心：predictor 用「歷史同星期同時段的淨流出/流入」等特徵，產出預測「區間」；
  # rule_engine 一律吃區間下界 lower_bound 當「預測到達存量」，再比對安全緩衝，
  # 而非用固定的「可借車數 ≤ 3」死判斷，也不吃點估計（steering §5 / NFR-1 可解釋性）。
  # 觸發靈敏度的作用：調整後到達存量 = 當前存量 −（當前存量 − 下界）× 觸發靈敏度。
  # 滿站側對稱：預測可還位下界 = 總車柱 − 區間上界 upper_bound，同樣比對安全緩衝。

# ── 目標水位（可被②AI 動態調整覆寫）──
# ADR-115 動態目標水位：補/抽車「補到幾台」不再用固定 50%，而是補到「能吸收後續高風險時段
#   淨流量」的水位——補車看 60 分累積 Δ 的 P10（悲觀流出），抽車看 P90（樂觀流入），
#   再用 80/20 護欄夾住。過了尖峰後續流量趨緩，目標水位自然回落到接近 50/50。
#   安全緩衝底線改「比例」隨站大小縮放（大站自動留多一點，解決固定 2 台對大站風險過大）。
target:
  預設借用率百分比: 50       # 降級 fallback：無預測時退回補/抽到此固定水位
  安全緩衝_比例: 0.12        # 底線 = 柱數 × 12%（隨站大小縮放；補完至少要能維持在此之上）
  安全水位_下限: 0.20        # 80/20 護欄：補完存量不低於柱數 20%
  安全水位_上限: 0.80        # 80/20 護欄：補完存量不高於柱數 80%
  目標水位_視野分鐘: 60      # 用「撐到 60 分」的累積 Δ 算補/抽量（響應 30 + 撐一段）

# ── 優先級分級門檻（dispatcher 用，緊急度分數 0~100 → high/medium/low）──
priority_band:
  high_min: 70              # 分數 ≥ 70 為 high
  medium_min: 40            # 分數 ≥ 40 為 medium，其餘 low

# ── 緊急度權重（urgency 用）──
# 規則：所有權重範圍 [0, 1]，最大 1、最小 0。初始值待 B 優化。
urgency_weights:                    # 值域 0~1
  預測到達存量: 1.0
  站群緩衝: 0.5
  影響人數: 0.5
  調度到達時間: 0.3
  容量級距: 0.3
  時效敏感度: 0.3

# ── 環境係數（群組3，全體共用）──
# 規則：值域 [0, 3]，其中 1.0 = 無影響、<1 = 需求下降、>1 = 需求上升。初始值待 B 優化。
# （原本鎖 [0,1] 無法表達「需求上升」，如假日河濱爆量、活動湧入，已改為 [0,3]）
weather_factor:                     # 值域 0~3（1.0=無影響）
  sunny: 1.1                 # 好天氣略增（尤其休閒站）
  cloudy: 1.0
  rain: 0.7                 # 雨天需求打 7 折
  heavy_rain: 0.4
  typhoon: 0.1
holiday_factor:                     # 值域 0~3（1.0=無影響）
  weekday: 1.0
  weekend: 1.1
  long_holiday: 1.2
season_factor:                      # 值域 0~3（1.0=無影響）
  school_term: 1.0
  vacation: 0.85

# ── 調度資源限制（dispatcher 用）──
# 數字自洽性（C-12）：一趟載運量不得超過每車容量。
#   一趟最大載運 = 每趟最大站數 × 平均每站 quantity ≤ 每車容量
#   例：每車容量 15、平均每站 5 台 → 每趟最大站數 ≈ 3（15÷5）
#   單趟時間也應 ≤ 響應時間，避免一趟跨越多個時段。
# ★ADR-114：車輛實際載運量以 vehicles 主檔 max_capacity 為準（逐台可不同）；
#   下方「每車容量」僅為主檔未指定時的 fallback 預設，口徑統一為 15（與主檔預設一致）。
fleet:
  調度車數量: 41            # ADR-114：官方 2025 公布調度貨車數（seed 起始值，可增刪改，未來由車隊 API 覆蓋）
  每車容量: 15              # 台/車 fallback（主檔未指定 max_capacity 時用；以 vehicles 主檔為準）
  每趟最大站數: 3           # 由 每車容量 ÷ 平均每站 quantity 推導（15÷5≈3）
  每時段最大調度站數: 15     # 時段 = 30 分鐘（對齊資料解析度）；= 調度車數量 × 每趟最大站數 的合理上限內
  響應時間_分鐘: 30          # 從派發到到達的平均時間，規劃與 KPI 用的基準值
  彈性緩衝分鐘: 10          # 調度到達時間的緩衝
  車上載量有效期_分鐘: 240   # ADR-123：車上台數回報超過此時間視為過期，須重新回報才可確認派工

# ── 調度資源清單來源（ADR-114，providers 用；比照 data_source.mode 可抽換）──
# db = 本地 SQLite seed（開發/demo）；youbike_api = 未來接 YouBike 人力/車隊 API（尚未實作）
dispatch_resource:
  mode: db
  調度員總數: 350           # ADR-114：官方公布調度人員數（seed 起始值，純流水號無真名，可增刪改）
  駐點人員數: 30            # ADR-116：駐點人員數（seed，守熱門站現場調節，可增刪改）

# ── 班別（ADR-116，shift 用）──
# 三班連續覆蓋（無空窗）；時間為 HH:MM，跨午夜的大夜班 end < start 代表跨日。
# allow_cross_district：早/晚班綁區(false)、大夜班可跨區(true，大宗跨區復原)。
# peak_start/peak_end：該班尖峰時段（折返模式），無尖峰留空。
shifts:
  morning:                 # 早班
    start: "06:30"
    end: "15:30"
    peak_start: "07:30"
    peak_end: "09:30"
    allow_cross_district: false
  evening:                 # 晚班
    start: "15:30"
    end: "22:00"
    peak_start: "17:00"
    peak_end: "19:00"
    allow_cross_district: false
  night:                   # 大夜班（跨午夜）
    start: "22:00"
    end: "06:30"
    peak_start: ""
    peak_end: ""
    allow_cross_district: true

# ── 班別人力配置比例（ADR-312，seed_workforce_allocation 用）──
# 把調度人力分三班，班內再依行政區工作量配額分配。比例合理化依通勤負荷：
#   早班含早高峰(07:30-09:30 通勤湧入、空滿站最多) → 人力最多；
#   晚班含晚高峰(17:00-19:00) → 次多；大夜離峰做跨區大宗復原 → 最少但仍需一定量。
# 三值加總須為 1.0；各區各班至少留 1 名（最大餘數法分配時保底）。
shift_allocation:
  morning: 0.40            # 早班（含早高峰，最忙）
  evening: 0.35            # 晚班（含晚高峰）
  night: 0.25             # 大夜班（離峰跨區復原）

# ── 勞動工時（ADR-116，勞基法硬約束 + 工作警示）──
labor:
  連續工時上限_分鐘: 240     # 連續工作滿此值須休息（勞基法：4 小時）
  休息時間_分鐘: 30         # 休息時長（勞基法：至少 30 分）
  工時預警_分鐘: 180        # 連續工時達此值開始預警（提前 1 小時提醒該安排休息）

# ── 下一趟建議（ADR-117 離峰滾動排程，dispatcher.suggest_next_trip 用）──
# 綜合評分 = 緊急度分數 − 距離(km) × 每公里扣分。分數高者建議優先（由後台拍板，非自動派）。
dispatch_next:
  每公里扣分: 2.0           # 距離懲罰權重：離越遠扣越多（平衡緊急度與成本）

# ── 車隊靜態保留率（ADR-118，緊急救火用）──
# 全車隊固定保留一定比例為 standby，不參與常態派單；只由緊急救火觸發轉 active。
reserve:
  保留率: 0.12             # standby 比例（10~15%）；41 台 → 約 5 台待命

# ── 緊急救火觸發（ADR-118，emergency 用）──
# 死結 = 站點 100% 滿載或 0% 空車。某區同時多個大站死結且在途車來不及 → 派 standby 救火（可跨區）。
emergency:
  死結站數門檻: 3           # 某行政區同時 ≥ 此數的大站死結才觸發
  死結持續分鐘: 15          # 死結需持續 ≥ 此值（避免瞬時波動誤觸）
  在途門檻分鐘: 30          # 現有在途車抵達均 > 此值才需動用 standby
  大站柱數門檻: 40          # 「精華大站」的柱數下限（只有大站死結才算數）

# ── 即時天氣源（ADR-118，weather_source 用；比照 data_source.mode 可抽換）──
# mock = 開發/測試（不打外部 API）；cwa = 中央氣象署開放資料（正式，觀測站級）
# 精細度：觀測站級。雙資料集——雨量站(密度高,偵測驟雨)+氣象站(氣溫濕度)，最近測站對應。
# API key 放環境變數 CWA_WEATHER_API_KEY（.env，勿寫進版控）；政府平台憑證問題用 verify=False。
weather:
  mode: cwa
  county: "新北"           # 只取此縣市的測站
  timeout_sec: 5           # 出向 API 連線/讀取超時（出向資安）
  max_retries: 2           # 失敗重試上限（避免無限重試）

# ── 疲勞管理（dispatcher 用）──
# 「單次」= 單一輪班（whole shift），不是單趟。一個輪班累積搬運超過此值 → 排休息。
fatigue:
  單班最大搬運量: 150       # 一個輪班的累積上限（原「單次」語意不清，改「單班」）
  法定休息間隔小時: 4
  休息時間分鐘: 30

# ── ③即時覆寫（override_service 用）──
override:
  預設時效分鐘: 120         # 緊急覆寫多久後自動恢復

# ── ②AI 每日最適化（param_optimizer 用）──
optimization:
  回看天數: 3               # 可在後台調
  單次最大調幅百分比: 10     # 幅度上限，避免暴衝（管「每次調整量」）
  自動套用: false           # false = 需人工確認
  # ADR-124 係數生效接線：off=完全不讀參數（行為同接線前）／shadow=算但不採用，只附影子值／on=實際採用
  係數套用模式: "off"   # ★必須加引號：YAML 會把裸的 off/on 解析成布林值
  # 累積後的絕對護欄（管「係數本身的值」，與單次調幅並存）；壞值一律視為 1.0
  係數上下限: [0.8, 1.25]

# ── 事件影響（群組4，events 用）──
# 半徑基於「人願意走多遠」，不是活動規模本身。最遠 1~2 公里。
event_radius:
  基礎半徑_km: 0.5           # 借車集水區（80% 使用在 300~500m）
  最大半徑_km: 2.0           # 上限，再遠人不會走
# 影響程度 = 活動人數 vs 該半徑內站點總容納量 的比例
event_impact:
  # 影響比 = 預估活動人數 / 半徑內所有站點總車柱數
  # 例：1萬人湧入、周圍站點總容量 500 → 影響比 20，代表嚴重供需失衡
  # 比例越高 → 該區站點受影響越大 → 需求參數上調越多
  影響比上限: 10.0           # 影響比超過此值視為滿載影響（避免爆表）

# ── 地形分類門檻（geo_batch 用，坡度%）──
terrain_thresholds:
  flat_max: 3
  gentle_max: 5
  moderate_max: 8
  # >8 為 steep

# ── 警示（alert_service 用）──
alert:
  warning_urgency: 60       # 緊急度 ≥ 此 → warning
  critical_urgency: 85      # ≥ 此 → critical

# ── 成本模型（task_manager 算 estimated_fuel_cost 用，不寫死在程式碼）──
cost:
  油耗_元每公里: 5           # 調度車每公里油錢（NT$）
  人力_元每小時: 300         # 調度員時薪（NT$），成本試算用

# ── 交通估算（dispatcher 算交通時間用）──
travel:
  平均車速_公里每小時: 20    # 市區調度車平均速度，用於距離→時間換算
  每站搬運_分鐘: 5           # 每站取/送車的平均作業時間

# ── 資料庫（A5 SQLite 持久層）──
database:
  path: "backend/data/youbike.db"  # SQLite 檔案路徑；測試可設 ":memory:"，或用環境變數 YOUBIKE_DB_PATH 覆寫

# ── 資安（main.py 用）──
security:
  allowed_origins: ["http://localhost:5173"]  # CORS 白名單（正式改前端網域）
  # CORS 收斂：只開實際用到的方法/標頭，不用 *（NFR-8）
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Content-Type", "X-Operator-Id"]
  rate_limit_per_min: 120         # 每 IP 每分鐘請求上限（入向 DoS 防護）
  rate_limit_exempt_paths: ["/health"]  # 健康檢查不限流

# ── 戰情室顧問（ADR-311）──
# 金鑰只走環境變數（AWS_*）；這裡只放非機密預設。模型 ID 可用 BEDROCK_MODEL_ID 覆寫。
assistant:
  enabled: true
  provider: bedrock
  bedrock_region: ""                 # 空則用 AWS_REGION / ap-northeast-1
  bedrock_model_id: "amazon.nova-lite-v1:0"
  timeout_sec: 20
  max_tokens: 1200
  temperature: 0.2
  history_turns: 8
  question_max_chars: 500
  context_max_chars: 20000
  rate_limit_per_min: 10             # 每操作者每分鐘（成本護欄）

# ADR-302：未確認草稿只在單程序記憶體，重啟後需重新預覽。
dispatch_drafts:
  ttl_seconds: 300
  max_entries: 256

# 線上特徵／快取（ADR-121）
# ── 預測輸出（ADR-126 需求估計；conformal 校準已於 ADR-127 否決）──
prediction:
  # ADR-127：不對區間做 conformal 校準（實測偏移全為 0），故此處沒有校準開關；
  #          要重新評估須先立新 ADR，離線量測用 tools/fullscale_eval/conformal_check.py
  # ADR-126：是否輸出「未受供給限制的需求估計」（獨立欄位，不進觸發判斷）
  輸出未受限需求估計: false
  需求估計最小樣本數: 8    # 該站同時段「未觸底」的樣本數門檻；不足就回 null，不給看似確定的數字

serving:
  lag_tolerance_minutes: 5
  weather_max_age_minutes: 30
  prediction_cache_entries: 3000
  model_retry_sec: 30

# ── 緊急調度案件升級（ADR-309）──
# 階段＝從開案算起幾分鐘要再提示。必須遞增；L1 跳常駐橫幅，L2 跳強制彈窗並電話聯絡。
# 關案只認「有未結案任務涵蓋該站」或「站況恢復」，按「已讀」只靜音、不關案、不重置時鐘。
escalation:
  階段: [30, 45]            # 分鐘。第一個＝再提示，第二個＝電話聯絡
  靜音分鐘: 10              # 已讀／已聯絡／延後後暫時不打擾；時鐘照走
  值班聯絡:                 # 依行政區；找不到就用「預設」
    預設: { 姓名: "調度中心值班", 電話: "02-2960-3456" }
