# YouBike 智慧調度系統 — 系統設定檔（單一真實來源）
# 來源：.kiro/specs/youbike-dispatch-system/design.md §7　最後對齊：2026-08-31
#
# 核心決策（已與團隊確認）：觸發門檻採「動態判斷」，不用固定死數字。
#   predictor 依各站「歷史同星期同時段」的淨流出/流入等特徵，產出預測「區間」；
#   rule_engine 一律吃區間下界 lower_bound 當「預測到達存量」，比對 trigger.安全緩衝_台數，
#   不吃點估計（steering §5：規則引擎吃區間下界；NFR-1 可解釋性）。
#   trigger 底下的低/高水位百分比只是保底的輔助門檻，不是主要判斷依據。
#   根目錄 rule_engine.py 已於 2026-08-31 遷移為此動態版本。
#
# 這是系統的控制面板：所有數字集中在這裡，改這裡就能調整系統行為，不用改程式碼（D8）。
# 舊的 PoC 死數字版本已移到 config.poc_v1.yaml，根目錄既有分析腳本尚未遷移（見 README/交接說明）。

# ── 資料源（NFR-7 可抽換）──
data_source:
  mode: "mock"              # mock / historical / tdx / youbike_official（現場改這裡切換）
  tdx_api_key: ""           # 若用 TDX，正式環境填（勿寫進版控，用環境變數）
  youbike_official_url: ""  # 若現場用 YouBike 公司自己的即時源，填這裡
  refresh_interval_sec: 60  # 多久抓一次即時資料
  stale_after_sec: 180      # 即時資料超過幾秒視為過期（觸發降級標記）
  # 歷史資料源（S3 Parquet，A1）
  s3_bucket: "youbike-hackathon-2026"
  s3_prefix: "youbike_data"           # 分區：youbike_data/year_month=YYYY-MM/data.parquet
  historical_default_month: "2026-06" # 未指定月份時的預設分區

# ── 資料保留（FR-12 熱溫冷）──
retention:
  hot_days: 14              # 熱資料（即時推論）
  warm_days: 90             # 溫資料（重訓練/趨勢）
  # 超過 warm_days 歸檔或刪除

# ── 觸發規則（rule_engine 用）──
# 注意：空/滿危險「不是死數字」，而是動態的。
# 依各站「歷史同星期同時段」接下來 30 分鐘的淨流出/流入來判斷：
#   預測到達時存量 = 當前存量 - 該站該時段的歷史淨流出
#   若預測到達時存量會觸底（≤ 安全緩衝）→ 觸發
# 下面只設「安全緩衝」與「觸發靈敏度」這種通用參數，實際門檻由模型動態算。
trigger:
  安全緩衝_台數: 2           # 預測到達存量低於此視為危險（各站共用的最低緩衝）
  觸發靈敏度: 1.0           # 對淨流出速率的放大係數（越大越早觸發）
  低水位_借用率百分比: 10    # 輔助門檻（動態判斷之外的保底）
  高水位_借用率百分比: 90
  連續惡化時段數: 2
  # 動態核心：predictor 用「歷史同星期同時段的淨流出/流入」等特徵，產出預測「區間」；
  # rule_engine 一律吃區間下界 lower_bound 當「預測到達存量」，再比對安全緩衝，
  # 而非用固定的「可借車數 ≤ 3」死判斷，也不吃點估計（steering §5 / NFR-1 可解釋性）。
  # 觸發靈敏度的作用：調整後到達存量 = 當前存量 −（當前存量 − 下界）× 觸發靈敏度。
  # 滿站側對稱：預測可還位下界 = 總車柱 − 區間上界 upper_bound，同樣比對安全緩衝。

# ── 目標水位（可被②AI 動態調整覆寫）──
# ADR-115 動態目標水位：補/抽車「補到幾台」不再用固定 50%，而是補到「能吸收後續高風險時段
#   淨流量」的水位——補車看 60 分累積 Δ 的 P10（悲觀流出），抽車看 P90（樂觀流入），
#   再用 80/20 護欄夾住。過了尖峰後續流量趨緩，目標水位自然回落到接近 50/50。
#   安全緩衝底線改「比例」隨站大小縮放（大站自動留多一點，解決固定 2 台對大站風險過大）。
target:
  預設借用率百分比: 50       # 降級 fallback：無預測時退回補/抽到此固定水位
  安全緩衝_比例: 0.12        # 底線 = 柱數 × 12%（隨站大小縮放；補完至少要能維持在此之上）
  安全水位_下限: 0.20        # 80/20 護欄：補完存量不低於柱數 20%
  安全水位_上限: 0.80        # 80/20 護欄：補完存量不高於柱數 80%
  目標水位_視野分鐘: 60      # 用「撐到 60 分」的累積 Δ 算補/抽量（響應 30 + 撐一段）

# ── 優先級分級門檻（dispatcher 用，緊急度分數 0~100 → high/medium/low）──
priority_band:
  high_min: 70              # 分數 ≥ 70 為 high
  medium_min: 40            # 分數 ≥ 40 為 medium，其餘 low

# ── 緊急度權重（urgency 用）──
# 規則：所有權重範圍 [0, 1]，最大 1、最小 0。初始值待 B 優化。
urgency_weights:                    # 值域 0~1
  預測到達存量: 1.0
  站群緩衝: 0.5
  影響人數: 0.5
  調度到達時間: 0.3
  容量級距: 0.3
  時效敏感度: 0.3

# ── 環境係數（群組3，全體共用）──
# 規則：值域 [0, 3]，其中 1.0 = 無影響、<1 = 需求下降、>1 = 需求上升。初始值待 B 優化。
# （原本鎖 [0,1] 無法表達「需求上升」，如假日河濱爆量、活動湧入，已改為 [0,3]）
weather_factor:                     # 值域 0~3（1.0=無影響）
  sunny: 1.1                 # 好天氣略增（尤其休閒站）
  cloudy: 1.0
  rain: 0.7                 # 雨天需求打 7 折
  heavy_rain: 0.4
  typhoon: 0.1
holiday_factor:                     # 值域 0~3（1.0=無影響）
  weekday: 1.0
  weekend: 1.1
  long_holiday: 1.2
season_factor:                      # 值域 0~3（1.0=無影響）
  school_term: 1.0
  vacation: 0.85

# ── 調度資源限制（dispatcher 用）──
# 數字自洽性（C-12）：一趟載運量不得超過每車容量。
#   一趟最大載運 = 每趟最大站數 × 平均每站 quantity ≤ 每車容量
#   例：每車容量 15、平均每站 5 台 → 每趟最大站數 ≈ 3（15÷5）
#   單趟時間也應 ≤ 響應時間，避免一趟跨越多個時段。
# ★ADR-114：車輛實際載運量以 vehicles 主檔 max_capacity 為準（逐台可不同）；
#   下方「每車容量」僅為主檔未指定時的 fallback 預設，口徑統一為 15（與主檔預設一致）。
fleet:
  調度車數量: 41            # ADR-114：官方 2025 公布調度貨車數（seed 起始值，可增刪改，未來由車隊 API 覆蓋）
  每車容量: 15              # 台/車 fallback（主檔未指定 max_capacity 時用；以 vehicles 主檔為準）
  每趟最大站數: 3           # 由 每車容量 ÷ 平均每站 quantity 推導（15÷5≈3）
  每時段最大調度站數: 15     # 時段 = 30 分鐘（對齊資料解析度）；= 調度車數量 × 每趟最大站數 的合理上限內
  響應時間_分鐘: 30          # 從派發到到達的平均時間，規劃與 KPI 用的基準值
  彈性緩衝分鐘: 10          # 調度到達時間的緩衝

# ── 調度資源清單來源（ADR-114，providers 用；比照 data_source.mode 可抽換）──
# db = 本地 SQLite seed（開發/demo）；youbike_api = 未來接 YouBike 人力/車隊 API（尚未實作）
dispatch_resource:
  mode: db
  調度員總數: 350           # ADR-114：官方公布調度人員數（seed 起始值，純流水號無真名，可增刪改）

# ── 疲勞管理（dispatcher 用）──
# 「單次」= 單一輪班（whole shift），不是單趟。一個輪班累積搬運超過此值 → 排休息。
fatigue:
  單班最大搬運量: 150       # 一個輪班的累積上限（原「單次」語意不清，改「單班」）
  法定休息間隔小時: 4
  休息時間分鐘: 30

# ── ③即時覆寫（override_service 用）──
override:
  預設時效分鐘: 120         # 緊急覆寫多久後自動恢復

# ── ②AI 每日最適化（param_optimizer 用）──
optimization:
  回看天數: 3               # 可在後台調
  單次最大調幅百分比: 10     # 幅度上限，避免暴衝
  自動套用: false           # false = 需人工確認

# ── 事件影響（群組4，events 用）──
# 半徑基於「人願意走多遠」，不是活動規模本身。最遠 1~2 公里。
event_radius:
  基礎半徑_km: 0.5           # 借車集水區（80% 使用在 300~500m）
  最大半徑_km: 2.0           # 上限，再遠人不會走
# 影響程度 = 活動人數 vs 該半徑內站點總容納量 的比例
event_impact:
  # 影響比 = 預估活動人數 / 半徑內所有站點總車柱數
  # 例：1萬人湧入、周圍站點總容量 500 → 影響比 20，代表嚴重供需失衡
  # 比例越高 → 該區站點受影響越大 → 需求參數上調越多
  影響比上限: 10.0           # 影響比超過此值視為滿載影響（避免爆表）

# ── 地形分類門檻（geo_batch 用，坡度%）──
terrain_thresholds:
  flat_max: 3
  gentle_max: 5
  moderate_max: 8
  # >8 為 steep

# ── 警示（alert_service 用）──
alert:
  warning_urgency: 60       # 緊急度 ≥ 此 → warning
  critical_urgency: 85      # ≥ 此 → critical

# ── 成本模型（task_manager 算 estimated_fuel_cost 用，不寫死在程式碼）──
cost:
  油耗_元每公里: 5           # 調度車每公里油錢（NT$）
  人力_元每小時: 300         # 調度員時薪（NT$），成本試算用

# ── 交通估算（dispatcher 算交通時間用）──
travel:
  平均車速_公里每小時: 20    # 市區調度車平均速度，用於距離→時間換算
  每站搬運_分鐘: 5           # 每站取/送車的平均作業時間

# ── 資料庫（A5 SQLite 持久層）──
database:
  path: "backend/data/youbike.db"  # SQLite 檔案路徑；測試可設 ":memory:"，或用環境變數 YOUBIKE_DB_PATH 覆寫

# ── 資安（main.py 用）──
security:
  allowed_origins: ["http://localhost:5173"]  # CORS 白名單（正式改前端網域）
  # CORS 收斂：只開實際用到的方法/標頭，不用 *（NFR-8）
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Content-Type", "X-Operator-Id"]
  rate_limit_per_min: 120         # 每 IP 每分鐘請求上限（入向 DoS 防護）
  rate_limit_exempt_paths: ["/health"]  # 健康檢查不限流
