# YouBike 智慧調度系統 — 本機一鍵啟動
# 用法：docker-compose up
# 後端：http://localhost:8000/docs
#
# 注意：backend 的 config_loader/mock_store 會往「上一層」找 config.yaml 與
#       frontend/src/mock/mock_data.json，所以把專案根目錄掛進容器。

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # 掛入設定檔與 mock 資料（唯讀），路徑用環境變數指定
      - ./config.yaml:/data/config.yaml:ro
      - ./frontend/src/mock/mock_data.json:/data/mock_data.json:ro
      - youbike-runtime:/data/runtime
    environment:
      - PYTHONUNBUFFERED=1
      - YOUBIKE_CONFIG_PATH=/data/config.yaml
      - YOUBIKE_MOCK_PATH=/data/mock_data.json
      - YOUBIKE_DB_PATH=/data/runtime/youbike.db
      - YOUBIKE_CLOCK_DB_PATH=/data/runtime/service_clock.db
    # A0 階段：後端回 mock，不需 .env；A1 接資料源後再掛 .env

  # ADR-320：空滿時計獨立收集，不經 uvicorn --reload。
  clock-worker:
    image: youbike-backend
    command: ["python", "tools/service_clock_worker.py"]
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - youbike-runtime:/data/runtime
    environment:
      - PYTHONUNBUFFERED=1
      - YOUBIKE_CONFIG_PATH=/data/config.yaml
      - YOUBIKE_CLOCK_DB_PATH=/data/runtime/service_clock.db
    restart: unless-stopped

  # frontend 待 C0 建立 frontend/Dockerfile 後再啟用
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  youbike-runtime:
